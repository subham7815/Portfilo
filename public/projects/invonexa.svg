  <text x="70" y="280" font-family="sans-serif" font-size="12" fill="#94a3b8">Recurring</text>
  <text x="70" y="320" font-family="sans-serif" font-size="12" fill="#94a3b8">Settings</text>

  <!-- KPI Cards -->
  <rect x="205" y="80" width="175" height="85" rx="8" fill="#111827" stroke="rgba(255,255,255,0.06)"/>
  <text x="220" y="105" font-family="sans-serif" font-size="11" fill="#9ca3af">TOTAL BILLED</text>
  <text x="220" y="135" font-family="sans-serif" font-size="22" font-weight="700" fill="#fff">$84,250</text>
  <text x="220" y="153" font-family="sans-serif" font-size="10" fill="#10b981">▲ 18.2% this month</text>

  <rect x="395" y="80" width="175" height="85" rx="8" fill="#111827" stroke="rgba(255,255,255,0.06)"/>
  <text x="410" y="105" font-family="sans-serif" font-size="11" fill="#9ca3af">PAID INVOICES</text>
  <text x="410" y="135" font-family="sans-serif" font-size="22" font-weight="700" fill="#fff">142</text>
  <text x="410" y="153" font-family="sans-serif" font-size="10" fill="#10b981">98.4% collection rate</text>

  <rect x="585" y="80" width="185" height="85" rx="8" fill="#111827" stroke="rgba(255,255,255,0.06)"/>
