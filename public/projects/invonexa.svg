<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Top bar -->
  <rect x="30" y="25" width="740" height="42" rx="8" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="55" cy="46" r="5" fill="#ef4444"/>
  <circle cx="72" cy="46" r="5" fill="#f59e0b"/>
  <circle cx="89" cy="46" r="5" fill="#10b981"/>
  <rect x="120" y="36" width="320" height="20" rx="4" fill="#1f2937"/>
  <text x="135" y="50" font-family="monospace" font-size="11" fill="#9ca3af">invonexa.io/dashboard/invoices</text>
  <rect x="670" y="34" width="85" height="24" rx="12" fill="url(#primary)"/>
  <text x="683" y="50" font-family="sans-serif" font-size="11" font-weight="600" fill="#fff">+ New Invoice</text>

  <!-- Left Sidebar -->
