  <text x="118" y="115" font-family="sans-serif" font-size="10" fill="#94a3b8">SaaS</text>
  
  <rect x="42" y="140" width="136" height="32" rx="6" fill="#1e293b"/>
  <text x="70" y="160" font-family="sans-serif" font-size="12" fill="#fff" font-weight="600">Invoices</text>
  <text x="70" y="200" font-family="sans-serif" font-size="12" fill="#94a3b8">Clients</text>
