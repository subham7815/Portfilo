  <!-- Row 1 -->
  <text x="225" y="275" font-family="monospace" font-size="11" fill="#60a5fa">INV-2024-001</text>
  <text x="320" y="275" font-family="sans-serif" font-size="11" fill="#fff">Acme Corp</text>
  <text x="470" y="275" font-family="sans-serif" font-size="11" fill="#fff">$4,200.00</text>
  <rect x="580" y="262" width="50" height="18" rx="9" fill="rgba(16,185,129,0.15)"/>
  <text x="592" y="275" font-family="sans-serif" font-size="10" font-weight="600" fill="#10b981">PAID</text>

  <!-- Row 2 -->
  <text x="225" y="315" font-family="monospace" font-size="11" fill="#60a5fa">INV-2024-002</text>
  <text x="320" y="315" font-family="sans-serif" font-size="11" fill="#fff">Stripe Labs</text>
  <text x="470" y="315" font-family="sans-serif" font-size="11" fill="#fff">$8,500.00</text>
  <rect x="580" y="302" width="50" height="18" rx="9" fill="rgba(16,185,129,0.15)"/>
  <text x="592" y="315" font-family="sans-serif" font-size="10" font-weight="600" fill="#10b981">PAID</text>

  <!-- Row 3 -->
  <text x="225" y="355" font-family="monospace" font-size="11" fill="#60a5fa">INV-2024-003</text>
  <text x="320" y="355" font-family="sans-serif" font-size="11" fill="#fff">Vercel Inc</text>
  <text x="470" y="355" font-family="sans-serif" font-size="11" fill="#fff">$3,150.00</text>
  <rect x="580" y="342" width="60" height="18" rx="9" fill="rgba(59,130,246,0.15)"/>
  <text x="588" y="355" font-family="sans-serif" font-size="10" font-weight="600" fill="#60a5fa">PENDING</text>

  <!-- Row 4 -->
  <text x="225" y="395" font-family="monospace" font-size="11" fill="#60a5fa">INV-2024-004</text>
  <text x="320" y="395" font-family="sans-serif" font-size="11" fill="#fff">Supabase Studio</text>
  <text x="470" y="395" font-family="sans-serif" font-size="11" fill="#fff">$12,400.00</text>
  <rect x="580" y="382" width="50" height="18" rx="9" fill="rgba(16,185,129,0.15)"/>
  <text x="592" y="395" font-family="sans-serif" font-size="10" font-weight="600" fill="#10b981">PAID</text>

  <!-- Bottom status -->
  <line x1="225" y1="420" x2="750" y2="420" stroke="#1f2937"/>
  <text x="225" y="445" font-family="sans-serif" font-size="11" fill="#6b7280">Built with Next.js 14 · TypeScript · Tailwind CSS · Prisma</text>
</svg>
