<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="repBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="phoneGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#repBg)"/>

  <!-- Left details -->
  <text x="60" y="100" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#fb923c">CROSS-PLATFORM ARCHITECTURE</text>
  <text x="60" y="145" font-family="serif" font-size="38" font-weight="700" fill="#fafaf9">Replica App</text>
  <text x="60" y="185" font-family="sans-serif" font-size="14" fill="#a8a29e" width="300">
    High-fidelity interactive mobile &amp; web interface
  </text>
  <text x="60" y="210" font-family="sans-serif" font-size="14" fill="#a8a29e">
    recreation built with TypeScript, Expo &amp; React.
  </text>

  <rect x="60" y="250" width="120" height="36" rx="18" fill="rgba(251,146,60,0.15)" stroke="#fb923c"/>
  <text x="82" y="273" font-family="sans-serif" font-size="12" font-weight="600" fill="#fb923c">TypeScript</text>

  <rect x="190" y="250" width="100" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
  <text x="210" y="273" font-family="sans-serif" font-size="12" font-weight="600" fill="#e7e5e4">React</text>

  <rect x="300" y="250" width="100" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
  <text x="324" y="273" font-family="sans-serif" font-size="12" font-weight="600" fill="#e7e5e4">Expo</text>

  <text x="60" y="340" font-family="sans-serif" font-size="12" fill="#78716c">FEATURES INCLUDED</text>
  <text x="60" y="370" font-family="sans-serif" font-size="13" fill="#d6d3d1">✓ Native gesture navigation &amp; haptics</text>
  <text x="60" y="395" font-family="sans-serif" font-size="13" fill="#d6d3d1">✓ Dark/Light mode dynamic switching</text>
  <text x="60" y="420" font-family="sans-serif" font-size="13" fill="#d6d3d1">✓ High FPS fluid screen transitions</text>

  <!-- Right Phone Mockup -->
  <rect x="490" y="50" width="230" height="420" rx="36" fill="#18181b" stroke="#3f3f46" stroke-width="4"/>
  <!-- Phone Screen -->
  <rect x="502" y="65" width="206" height="390" rx="26" fill="#09090b"/>
  <!-- Dynamic Island -->
  <rect x="565" y="75" width="80" height="18" rx="9" fill="#000"/>
  <!-- Screen Content -->
  <circle cx="605" cy="140" r="30" fill="url(#phoneGlow)"/>
  <text x="605" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">Replica UI</text>
  <text x="605" y="215" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a1a1aa">Native Motion Experience</text>
  
  <rect x="520" y="240" width="170" height="44" rx="12" fill="#27272a"/>
  <rect x="532" y="252" width="20" height="20" rx="6" fill="#fb923c"/>
  <text x="562" y="267" font-family="sans-serif" font-size="10" font-weight="600" fill="#fff">Adaptive Widgets</text>

  <rect x="520" y="295" width="170" height="44" rx="12" fill="#27272a"/>
  <rect x="532" y="307" width="20" height="20" rx="6" fill="#ec4899"/>
  <text x="562" y="322" font-family="sans-serif" font-size="10" font-weight="600" fill="#fff">Audio &amp; Media Feed</text>

  <rect x="520" y="350" width="170" height="44" rx="12" fill="#27272a"/>
  <rect x="532" y="362" width="20" height="20" rx="6" fill="#a855f7"/>
  <text x="562" y="377" font-family="sans-serif" font-size="10" font-weight="600" fill="#fff">Cloud Sync</text>
</svg>

