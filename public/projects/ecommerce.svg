<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ecomBg)"/>

  <!-- Top bar -->
  <rect x="30" y="25" width="740" height="50" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
  <text x="55" y="56" font-family="sans-serif" font-size="18" font-weight="800" fill="#60a5fa">UrbanStore</text>
  <text x="210" y="55" font-family="sans-serif" font-size="12" fill="#e2e8f0">Men</text>
  <text x="260" y="55" font-family="sans-serif" font-size="12" fill="#94a3b8">Women</text>
  <text x="325" y="55" font-family="sans-serif" font-size="12" fill="#94a3b8">Footwear</text>
  <text x="400" y="55" font-family="sans-serif" font-size="12" fill="#94a3b8">Accessories</text>

  <rect x="520" y="37" width="160" height="26" rx="13" fill="#0f172a"/>
  <text x="540" y="54" font-family="sans-serif" font-size="11" fill="#64748b">🔍 Search products...</text>

  <rect x="695" y="37" width="60" height="26" rx="13" fill="url(#btnGrad)"/>
  <text x="710" y="54" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff">Cart (3)</text>

  <!-- Banner -->
  <rect x="30" y="90" width="740" height="130" rx="10" fill="#1e293b"/>
  <text x="60" y="140" font-family="serif" font-size="28" font-weight="700" fill="#fff">Summer Tech &amp; Urban Collection</text>
  <text x="60" y="170" font-family="sans-serif" font-size="13" fill="#94a3b8">Responsive storefront with dynamic cart, checkout &amp; product filters.</text>
  <rect x="60" y="185" width="110" height="26" rx="13" fill="#3b82f6"/>
  <text x="75" y="202" font-family="sans-serif" font-size="11" font-weight="600" fill="#fff">Shop Now →</text>

  <!-- Product Grid -->
  <!-- Card 1 -->
  <rect x="30" y="235" width="230" height="235" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
  <rect x="45" y="250" width="200" height="120" rx="6" fill="#0f172a"/>
  <text x="145" y="320" text-anchor="middle" font-size="40">👟</text>
  <text x="45" y="395" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">Air Cushion Runners</text>
  <text x="45" y="415" font-family="sans-serif" font-size="11" fill="#94a3b8">Active Athletic Footwear</text>
  <text x="45" y="445" font-family="sans-serif" font-size="14" font-weight="700" fill="#60a5fa">$129.99</text>
  <rect x="180" y="430" width="65" height="24" rx="12" fill="#3b82f6"/>
  <text x="195" y="446" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">+ Add</text>

  <!-- Card 2 -->
  <rect x="285" y="235" width="230" height="235" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
  <rect x="300" y="250" width="200" height="120" rx="6" fill="#0f172a"/>
  <text x="400" y="320" text-anchor="middle" font-size="40">🎧</text>
  <text x="300" y="395" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">ANC Wireless Studio</text>
  <text x="300" y="415" font-family="sans-serif" font-size="11" fill="#94a3b8">Lossless Audio 40h Battery</text>
  <text x="300" y="445" font-family="sans-serif" font-size="14" font-weight="700" fill="#60a5fa">$249.00</text>
  <rect x="435" y="430" width="65" height="24" rx="12" fill="#3b82f6"/>
  <text x="450" y="446" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">+ Add</text>

  <!-- Card 3 -->
  <rect x="540" y="235" width="230" height="235" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
  <rect x="555" y="250" width="200" height="120" rx="6" fill="#0f172a"/>
  <text x="655" y="320" text-anchor="middle" font-size="40">⌚</text>
  <text x="555" y="395" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">OLED Chrono Smartwatch</text>
  <text x="555" y="415" font-family="sans-serif" font-size="11" fill="#94a3b8">Health Tracking &amp; GPS</text>
  <text x="555" y="445" font-family="sans-serif" font-size="14" font-weight="700" fill="#60a5fa">$189.50</text>
  <rect x="690" y="430" width="65" height="24" rx="12" fill="#3b82f6"/>
  <text x="705" y="446" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff">+ Add</text>
</svg>
