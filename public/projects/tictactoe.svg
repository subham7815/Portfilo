<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tttBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#tttBg)"/>

  <text x="400" y="70" text-anchor="middle" font-family="serif" font-size="34" font-weight="700" fill="#fff">Tic Tac Toe</text>
  <text x="400" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a5b4fc">Two-Player Interactive Web Game · Winner Detection · Score Keeper</text>

  <!-- Game Board -->
  <rect x="250" y="130" width="300" height="300" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
  
  <line x1="350" y1="145" x2="350" y2="415" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>
  <line x1="450" y1="145" x2="450" y2="415" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>
  
  <line x1="265" y1="230" x2="535" y2="230" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>
  <line x1="265" y1="330" x2="535" y2="330" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>

  <!-- Cells -->
  <!-- (0,0) X -->
  <text x="300" y="200" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="800" fill="#38bdf8">X</text>
  <!-- (0,1) O -->
  <text x="400" y="200" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="800" fill="#f43f5e">O</text>
  <!-- (0,2) X -->
  <text x="500" y="200" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="800" fill="#38bdf8">X</text>

  <!-- (1,0) O -->
  <text x="300" y="300" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="800" fill="#f43f5e">O</text>
  <!-- (1,1) X -->
  <text x="400" y="300" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="800" fill="#38bdf8">X</text>
  <!-- (1,2) O -->
  <text x="500" y="300" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="800" fill="#f43f5e">O</text>

  <!-- (2,0) X (Winner diagonal line!) -->
  <text x="300" y="400" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="800" fill="#38bdf8">X</text>
  <!-- (2,1) -->
  <text x="400" y="400" text-anchor="middle" font-family="sans-serif" font-size="40" fill="#475569">·</text>
  <!-- (2,2) -->
  <text x="500" y="400" text-anchor="middle" font-family="sans-serif" font-size="40" fill="#475569">·</text>

  <!-- Strike through winner -->
  <line x1="280" y1="410" x2="520" y2="170" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>

  <!-- Winner message -->
  <rect x="330" y="445" width="140" height="30" rx="15" fill="#38bdf8"/>
  <text x="400" y="465" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Player X Won! 🎉</text>
</svg>
