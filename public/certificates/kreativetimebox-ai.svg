<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" height="100%">
  <defs>
    <linearGradient id="ktPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ktGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="900" height="640" rx="4" fill="#ffffff"/>

  <!-- Ornate Border -->
  <rect x="24" y="24" width="852" height="592" fill="none" stroke="#1e1b4b" stroke-width="4"/>
  <rect x="32" y="32" width="836" height="576" fill="none" stroke="#9333ea" stroke-width="1.5"/>
  <rect x="36" y="36" width="828" height="568" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Top Logo Banner -->
  <g transform="translate(60, 60)">
    <circle cx="28" cy="28" r="22" fill="#9333ea"/>
    <text x="28" y="36" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#ffffff">✦</text>
    <text x="65" y="28" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800" letter-spacing="2" fill="#1e1b4b">KreativeTimebox<tspan fill="#9333ea">.</tspan></text>
    <text x="65" y="46" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#64748b">AI RESEARCH &amp; DOCUMENT INTELLIGENCE</text>
  </g>

  <!-- Verified Badge Top Right -->
  <g transform="translate(680, 60)">
    <rect width="155" height="38" rx="19" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="8" fill="#9333ea"/>
    <text x="18" y="23" font-family="sans-serif" font-size="12" fill="#fff" font-weight="900">✓</text>
    <text x="38" y="23" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#6b21a8" letter-spacing="0.5">INTERN HONORS</text>
  </g>

  <!-- Certificate Heading -->
  <text x="450" y="180" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#64748b">CERTIFICATE OF INTERNSHIP EXCELLENCE</text>
  <text x="450" y="225" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#1e1b4b">AI/ML Engineering Practitioner</text>
  <line x1="320" y1="245" x2="580" y2="245" stroke="#9333ea" stroke-width="2"/>

  <!-- Presentation text -->
  <text x="450" y="285" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-style="italic" fill="#64748b">This is proudly awarded to</text>
  <text x="450" y="335" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#1e1b4b">Subham Kumar Nayak</text>

  <!-- Description -->
  <text x="450" y="380" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="#334155">
    in recognition of outstanding contributions as an AI/ML Intern working on
  </text>
  <text x="450" y="415" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#1e1b4b">
    AI-Powered Financial Document Processing &amp; OCR
  </text>

  <text x="450" y="450" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">
    Vision Language Models (VLM) · OCR Pipelines · Model Output Verification · Defect Debugging · PyTorch
  </text>

  <line x1="80" y1="495" x2="820" y2="495" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left: Domain -->
  <g transform="translate(80, 520)">
    <text x="0" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">RESEARCH DOMAIN</text>
    <text x="0" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e1b4b">Document AI / Computer Vision</text>
    <text x="0" y="52" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">KreativeTimebox Research Labs</text>
  </g>

  <!-- Center: Gold Seal -->
  <g transform="translate(415, 505)">
    <circle cx="35" cy="35" r="34" fill="url(#ktGold)"/>
    <circle cx="35" cy="35" r="30" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="35" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="900" fill="#fff" letter-spacing="1">DOCUMENT</text>
    <text x="35" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#fff">AI/ML</text>
  </g>

  <!-- Right: Signatures -->
  <g transform="translate(660, 515)">
    <path d="M 10 28 Q 30 10, 50 25 T 90 20 T 130 25" fill="none" stroke="#1e1b4b" stroke-width="2"/>
    <line x1="0" y1="36" x2="160" y2="36" stroke="#94a3b8" stroke-width="1"/>
    <text x="80" y="52" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1e1b4b">Director of AI Research</text>
    <text x="80" y="66" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">KreativeTimebox Technologies</text>
  </g>
</svg>
