<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180c2e"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="700" height="480" rx="16" fill="url(#aiBg)" stroke="#a855f7" stroke-width="2"/>
  <rect x="12" y="12" width="676" height="456" rx="12" fill="none" stroke="rgba(168,85,247,0.2)" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Top Logo Banner -->
  <g transform="translate(45, 40)">
    <circle cx="28" cy="28" r="24" fill="url(#purpleGrad)"/>
    <text x="28" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="900" fill="#fff">✦</text>
    <text x="65" y="24" font-family="sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#c084fc">KREATIVE TIMEBOX</text>
    <text x="65" y="42" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#94a3b8">AI/ML RESEARCH &amp; DOCUMENT INTELLIGENCE</text>
  </g>

  <!-- Verified Badge on Right -->
  <g transform="translate(540, 35)">
    <rect width="115" height="32" rx="16" fill="rgba(168,85,247,0.15)" stroke="#a855f7"/>
    <circle cx="20" cy="16" r="6" fill="#a855f7"/>
    <text x="17" y="19" font-family="sans-serif" font-size="9" fill="#180c2e" font-weight="900">✓</text>
    <text x="35" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#c084fc">VERIFIED</text>
  </g>

  <!-- Certificate Title -->
  <text x="45" y="145" font-family="sans-serif" font-size="11" letter-spacing="3" font-weight="700" fill="#cbd5e1">ENGINEERING INTERNSHIP &amp; PRACTITIONER</text>
  <text x="45" y="185" font-family="serif" font-size="30" font-weight="700" fill="#ffffff">Document AI &amp; Vision Machine Learning</text>
  <text x="45" y="215" font-family="sans-serif" font-size="16" font-weight="700" fill="#c084fc">KreativeTimebox — AI/ML Practitioner</text>

  <!-- Recipient -->
  <text x="45" y="260" font-family="sans-serif" font-size="11" letter-spacing="2" fill="#64748b">PROUDLY PRESENTED TO</text>
  <text x="45" y="295" font-family="serif" font-size="26" font-weight="700" fill="#f1f5f9">Subham Kumar Nayak</text>

  <!-- Competencies & Skills validated -->
  <text x="45" y="340" font-family="sans-serif" font-size="11" fill="#94a3b8">
    Demonstrated outstanding proficiency in Optical Character Recognition (OCR), Vision Language Models (VLM),
  </text>
  <text x="45" y="360" font-family="sans-serif" font-size="11" fill="#94a3b8">
    automated document parsing pipelines, layout analysis, PyTorch model deployment, and OpenCV image processing.
  </text>

  <!-- Bottom Details -->
  <line x1="45" y1="395" x2="655" y2="395" stroke="rgba(255,255,255,0.08)"/>

  <text x="45" y="430" font-family="sans-serif" font-size="10" fill="#64748b">RESEARCH DOMAIN</text>
  <text x="45" y="448" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Document AI / Computer Vision</text>

  <text x="280" y="430" font-family="sans-serif" font-size="10" fill="#64748b">CORE FRAMEWORKS</text>
  <text x="280" y="448" font-family="sans-serif" font-size="12" font-weight="600" fill="#c084fc">PyTorch · OpenCV · OCR · VLM</text>

  <!-- Gold Seal -->
  <g transform="translate(565, 385)">
    <circle cx="45" cy="45" r="32" fill="url(#gold3)"/>
    <circle cx="45" cy="45" r="28" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="45" y="42" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="900" fill="#78350f">AI/ML</text>
    <text x="45" y="54" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="900" fill="#78350f">HONORS</text>
  </g>
