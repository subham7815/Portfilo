<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <linearGradient id="hrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071917"/>
      <stop offset="100%" stop-color="#020d0c"/>
    </linearGradient>
    <linearGradient id="hrGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00EA64"/>
      <stop offset="100%" stop-color="#00A843"/>
    </linearGradient>
  </defs>

  <rect width="700" height="480" rx="16" fill="url(#hrBg)" stroke="#00EA64" stroke-width="2"/>
  <rect x="12" y="12" width="676" height="456" rx="12" fill="none" stroke="rgba(0,234,100,0.2)" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Top Logo Banner -->
  <g transform="translate(45, 40)">
    <rect width="36" height="36" rx="8" fill="url(#hrGreen)"/>
    <text x="18" y="26" text-anchor="middle" font-family="monospace" font-size="22" font-weight="900" fill="#000">H</text>
    <text x="50" y="24" font-family="sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#00EA64">HACKERRANK</text>
    <text x="50" y="42" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#94a3b8">STANDARDIZED SKILLS ASSESSMENT</text>
  </g>

  <!-- Verified Badge -->
  <g transform="translate(540, 35)">
    <rect width="115" height="32" rx="16" fill="rgba(0,234,100,0.15)" stroke="#00EA64"/>
    <circle cx="20" cy="16" r="6" fill="#00EA64"/>
    <text x="17" y="19" font-family="sans-serif" font-size="9" fill="#000" font-weight="900">✓</text>
    <text x="35" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#00EA64">VERIFIED</text>
  </g>

  <!-- Title -->
  <text x="45" y="145" font-family="sans-serif" font-size="11" letter-spacing="3" font-weight="700" fill="#cbd5e1">SKILL CERTIFICATION TEST</text>
  <text x="45" y="185" font-family="serif" font-size="30" font-weight="700" fill="#ffffff">Frontend Developer (React)</text>
  <text x="45" y="215" font-family="sans-serif" font-size="16" font-weight="700" fill="#00EA64">HackerRank Certified</text>

  <!-- Recipient -->
  <text x="45" y="260" font-family="sans-serif" font-size="11" letter-spacing="2" fill="#64748b">CERTIFIED DEVELOPER</text>
  <text x="45" y="295" font-family="serif" font-size="26" font-weight="700" fill="#f1f5f9">Subham Kumar Nayak</text>

  <!-- Description -->
  <text x="45" y="340" font-family="sans-serif" font-size="11" fill="#94a3b8">
    Successfully cleared timed assessment testing core React principles: Components, State Management,
  </text>
  <text x="45" y="360" font-family="sans-serif" font-size="11" fill="#94a3b8">
    Hooks, Props Lifecycle, API Integration, and Performance Optimization under strict evaluation.
  </text>

  <line x1="45" y1="395" x2="655" y2="395" stroke="rgba(255,255,255,0.08)"/>

  <text x="45" y="430" font-family="sans-serif" font-size="10" fill="#64748b">AUTHORITY</text>
  <text x="45" y="448" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">HackerRank Technical Assessment</text>

  <text x="280" y="430" font-family="sans-serif" font-size="10" fill="#64748b">DOMAIN</text>
  <text x="280" y="448" font-family="sans-serif" font-size="12" font-weight="600" fill="#00EA64">React.js · JavaScript (ES6+)</text>

  <!-- Seal -->
  <g transform="translate(565, 385)">
    <circle cx="45" cy="45" r="32" fill="url(#hrGreen)"/>
    <circle cx="45" cy="45" r="28" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="45" y="42" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="900" fill="#000">HACKERRANK</text>
    <text x="45" y="54" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="900" fill="#000">CERTIFIED</text>
  </g>
</svg>
