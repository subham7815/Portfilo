<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <linearGradient id="delBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1710"/>
      <stop offset="100%" stop-color="#050a06"/>
    </linearGradient>
    <linearGradient id="delGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="700" height="480" rx="16" fill="url(#delBg)" stroke="#86efac" stroke-width="2"/>
  <rect x="12" y="12" width="676" height="456" rx="12" fill="none" stroke="rgba(134,239,172,0.2)" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Top Logo Banner -->
  <g transform="translate(45, 40)">
    <text x="0" y="32" font-family="sans-serif" font-size="28" font-weight="900" fill="#ffffff">Deloitte<tspan fill="#86efac">.</tspan></text>
    <text x="0" y="52" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#94a3b8">DATA ANALYTICS JOB SIMULATION</text>
  </g>

  <!-- Verified Badge -->
  <g transform="translate(540, 35)">
    <rect width="115" height="32" rx="16" fill="rgba(34,197,94,0.15)" stroke="#22c55e"/>
    <circle cx="20" cy="16" r="6" fill="#22c55e"/>
    <text x="17" y="19" font-family="sans-serif" font-size="9" fill="#04202c" font-weight="900">✓</text>
    <text x="35" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#86efac">VERIFIED</text>
  </g>

  <!-- Title -->
  <text x="45" y="145" font-family="sans-serif" font-size="11" letter-spacing="3" font-weight="700" fill="#cbd5e1">VIRTUAL EXPERIENCE CREDENTIAL</text>
  <text x="45" y="185" font-family="serif" font-size="30" font-weight="700" fill="#ffffff">Data Analytics Job Simulation</text>
  <text x="45" y="215" font-family="sans-serif" font-size="16" font-weight="700" fill="#86efac">Deloitte Australia &amp; Forage</text>

  <!-- Recipient -->
  <text x="45" y="260" font-family="sans-serif" font-size="11" letter-spacing="2" fill="#64748b">COMPLETED BY</text>
  <text x="45" y="295" font-family="serif" font-size="26" font-weight="700" fill="#f1f5f9">Subham Kumar Nayak</text>

  <!-- Description -->
  <text x="45" y="340" font-family="sans-serif" font-size="11" fill="#94a3b8">
    Completed practical tasks in business data analysis, forensic analytics, dashboard creation,
  </text>
  <text x="45" y="360" font-family="sans-serif" font-size="11" fill="#94a3b8">
    and client presentation of complex telemetry metrics and corporate analytics recommendations.
  </text>

  <line x1="45" y1="395" x2="655" y2="395" stroke="rgba(255,255,255,0.08)"/>

  <text x="45" y="430" font-family="sans-serif" font-size="10" fill="#64748b">SIMULATION PROVIDER</text>
  <text x="45" y="448" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Deloitte · Forage</text>

  <text x="280" y="430" font-family="sans-serif" font-size="10" fill="#64748b">SKILLS COVERED</text>
  <text x="280" y="448" font-family="sans-serif" font-size="12" font-weight="600" fill="#86efac">Tableau · Data Strategy · Forensics</text>

  <!-- Seal -->
  <g transform="translate(565, 385)">
    <circle cx="45" cy="45" r="32" fill="url(#delGreen)"/>
    <circle cx="45" cy="45" r="28" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="45" y="42" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="900" fill="#052e16">DELOITTE</text>
    <text x="45" y="54" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="900" fill="#052e16">ANALYTICS</text>
  </g>
</svg>

