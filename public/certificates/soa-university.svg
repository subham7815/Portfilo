<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" height="100%">
  <defs>
    <linearGradient id="soaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="soaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="900" height="640" rx="4" fill="#ffffff"/>

  <!-- Ornate Border -->
  <rect x="24" y="24" width="852" height="592" fill="none" stroke="#1e3a8a" stroke-width="4"/>
  <rect x="32" y="32" width="836" height="576" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="36" y="36" width="828" height="568" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Top Logo Banner -->
  <g transform="translate(60, 60)">
    <circle cx="28" cy="28" r="22" fill="#1e3a8a"/>
    <text x="28" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="900" fill="#ffffff">SOA</text>
    <text x="65" y="28" font-family="Georgia, serif" font-size="22" font-weight="800" letter-spacing="1" fill="#1e3a8a">Siksha 'O' Anusandhan</text>
    <text x="65" y="46" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#64748b">DEEMED TO BE UNIVERSITY · ITER BHUBANESWAR</text>
  </g>

  <!-- Verified Badge Top Right -->
  <g transform="translate(690, 60)">
    <rect width="145" height="38" rx="19" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="8" fill="#1d4ed8"/>
    <text x="18" y="23" font-family="sans-serif" font-size="12" fill="#fff" font-weight="900">✓</text>
    <text x="38" y="23" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1e40af" letter-spacing="0.5">ACCREDITED</text>
  </g>

  <!-- Certificate Heading -->
  <text x="450" y="180" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#64748b">DEGREE CONFERRED WITH HONORS</text>
  <text x="450" y="225" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#1e3a8a">Bachelor of Technology (B.Tech)</text>
  <line x1="320" y1="245" x2="580" y2="245" stroke="#f59e0b" stroke-width="2"/>

  <!-- Presentation text -->
  <text x="450" y="285" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-style="italic" fill="#64748b">On the recommendation of the Academic Senate, hereby confers upon</text>
  <text x="450" y="335" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#1e3a8a">Subham Kumar Nayak</text>

  <!-- Degree Discipline -->
  <text x="450" y="380" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="#334155">
    the degree of Bachelor of Technology in
  </text>
  <text x="450" y="415" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">
    Computer Science &amp; Engineering
  </text>

  <text x="450" y="450" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">
    Graduated with Cumulative Grade Point Average (CGPA) of 7.6 · Siksha 'O' Anusandhan University
  </text>

  <line x1="80" y1="495" x2="820" y2="495" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left: Faculty -->
  <g transform="translate(80, 520)">
    <text x="0" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">FACULTY OF ENGINEERING</text>
    <text x="0" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">ITER — SOA University</text>
    <text x="0" y="52" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Bhubaneswar, Odisha, India</text>
  </g>

  <!-- Center: Gold Seal -->
  <g transform="translate(415, 505)">
    <circle cx="35" cy="35" r="34" fill="url(#soaGold)"/>
    <circle cx="35" cy="35" r="30" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="35" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="900" fill="#fff" letter-spacing="1">SOA ITER</text>
    <text x="35" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#fff">B.TECH</text>
  </g>

  <!-- Right: Signatures -->
  <g transform="translate(660, 515)">
    <path d="M 10 28 Q 30 10, 50 25 T 90 20 T 130 25" fill="none" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="0" y1="36" x2="160" y2="36" stroke="#94a3b8" stroke-width="1"/>
    <text x="80" y="52" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Registrar &amp; Dean</text>
    <text x="80" y="66" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">Siksha 'O' Anusandhan</text>
  </g>
</svg>
