<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <linearGradient id="soaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="blueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gold4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="700" height="480" rx="16" fill="url(#soaBg)" stroke="#60a5fa" stroke-width="2"/>
  <rect x="12" y="12" width="676" height="456" rx="12" fill="none" stroke="rgba(96,165,250,0.2)" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Top Logo Banner -->
  <g transform="translate(45, 40)">
    <circle cx="28" cy="28" r="24" fill="url(#blueGold)"/>
    <text x="28" y="36" text-anchor="middle" font-family="serif" font-size="22" font-weight="900" fill="#fff">SOA</text>
    <text x="65" y="24" font-family="sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#60a5fa">SIKSHA 'O' ANUSANDHAN</text>
    <text x="65" y="42" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#94a3b8">DEEMED TO BE UNIVERSITY · FACULTY OF ENGINEERING</text>
  </g>

  <!-- Verified Badge on Right -->
  <g transform="translate(540, 35)">
    <rect width="115" height="32" rx="16" fill="rgba(96,165,250,0.15)" stroke="#60a5fa"/>
    <circle cx="20" cy="16" r="6" fill="#60a5fa"/>
    <text x="17" y="19" font-family="sans-serif" font-size="9" fill="#070a12" font-weight="900">✓</text>
    <text x="35" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#60a5fa">ACCREDITED</text>
  </g>

  <!-- Certificate Title -->
  <text x="45" y="145" font-family="sans-serif" font-size="11" letter-spacing="3" font-weight="700" fill="#cbd5e1">UNDERGRADUATE DEGREE CONFERRED</text>
  <text x="45" y="185" font-family="serif" font-size="30" font-weight="700" fill="#ffffff">Bachelor of Technology (B.Tech)</text>
  <text x="45" y="215" font-family="sans-serif" font-size="16" font-weight="700" fill="#60a5fa">Computer Science &amp; Engineering</text>

  <!-- Recipient -->
  <text x="45" y="260" font-family="sans-serif" font-size="11" letter-spacing="2" fill="#64748b">AWARDED WITH MERIT TO</text>
  <text x="45" y="295" font-family="serif" font-size="26" font-weight="700" fill="#f1f5f9">Subham Kumar Nayak</text>

  <!-- Competencies & Skills validated -->
  <text x="45" y="340" font-family="sans-serif" font-size="11" fill="#94a3b8">
    Completed rigorous core curriculum in Data Structures &amp; Algorithms, Computer Networks, Operating Systems,
  </text>
  <text x="45" y="360" font-family="sans-serif" font-size="11" fill="#94a3b8">
    Database Management Systems (DBMS), Object-Oriented Software Design, and Distributed Systems.
  </text>

  <!-- Bottom Details -->
  <line x1="45" y1="395" x2="655" y2="395" stroke="rgba(255,255,255,0.08)"/>

  <text x="45" y="430" font-family="sans-serif" font-size="10" fill="#64748b">INSTITUTION</text>
  <text x="45" y="448" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">ITER — SOA University, Odisha</text>

  <text x="280" y="430" font-family="sans-serif" font-size="10" fill="#64748b">DEGREE DISCIPLINE</text>
  <text x="280" y="448" font-family="sans-serif" font-size="12" font-weight="600" fill="#60a5fa">Computer Science &amp; Engineering</text>

  <!-- Gold Seal -->
  <g transform="translate(565, 385)">
    <circle cx="45" cy="45" r="32" fill="url(#gold4)"/>
    <circle cx="45" cy="45" r="28" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="45" y="42" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="900" fill="#78350f">GRADUATE</text>
    <text x="45" y="54" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="900" fill="#78350f">CSE</text>
  </g>
