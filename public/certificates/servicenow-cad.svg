<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" height="100%">
  <defs>
    <linearGradient id="snCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="goldSeal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Clean White/Ivory Certificate Background -->
  <rect width="900" height="640" rx="4" fill="#ffffff"/>

  <!-- Ornate Border -->
  <rect x="24" y="24" width="852" height="592" fill="none" stroke="#04202c" stroke-width="4"/>
  <rect x="32" y="32" width="836" height="576" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="36" y="36" width="828" height="568" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Top Logo Banner -->
  <g transform="translate(60, 60)">
    <circle cx="28" cy="28" r="22" fill="#0284c7"/>
    <text x="28" y="35" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff">&lt;/&gt;</text>
    <text x="65" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="2" fill="#04202c">servicenow<tspan fill="#0284c7">.</tspan></text>
    <text x="65" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#64748b">CERTIFIED APPLICATION DEVELOPER</text>
  </g>

  <!-- Verified Credential Badge Top Right -->
  <g transform="translate(690, 60)">
    <rect width="145" height="38" rx="19" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="8" fill="#0284c7"/>
    <text x="18" y="23" font-family="sans-serif" font-size="12" fill="#fff" font-weight="900">✓</text>
    <text x="38" y="23" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#0369a1" letter-spacing="0.5">NOW CERTIFIED</text>
  </g>

  <!-- Certificate Heading -->
  <text x="450" y="180" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#64748b">CERTIFICATE OF RECOGNITION</text>
  <text x="450" y="225" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#04202c">ServiceNow Certified Professional</text>
  <line x1="320" y1="245" x2="580" y2="245" stroke="#0284c7" stroke-width="2"/>

  <!-- Presentation text -->
  <text x="450" y="285" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-style="italic" fill="#64748b">This is to certify that</text>
  <text x="450" y="335" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#04202c">Subham Kumar Nayak</text>

  <!-- Certification title -->
  <text x="450" y="380" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="#334155">
    has successfully completed all requirements and is officially recognized as a
  </text>
  <text x="450" y="420" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#04202c">
    Certified Application Developer (CAD)
  </text>

  <!-- Competencies -->
  <text x="450" y="455" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">
    Scoped Application Architecture · Script Includes · GlideRecord/GlideSystem · REST Integrations · ATF Suites
  </text>

  <!-- Bottom Divider -->
  <line x1="80" y1="495" x2="820" y2="495" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left: Date & ID -->
  <g transform="translate(80, 520)">
    <text x="0" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">VERIFICATION CODE</text>
    <text x="0" y="34" font-family="monospace" font-size="12" font-weight="700" fill="#04202c">SN-CAD-2026-7815</text>
    <text x="0" y="52" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">learning.servicenow.com</text>
  </g>

  <!-- Center: Gold Official Seal -->
  <g transform="translate(415, 505)">
    <circle cx="35" cy="35" r="34" fill="url(#goldSeal2)"/>
    <circle cx="35" cy="35" r="30" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="35" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="900" fill="#fff" letter-spacing="1">OFFICIAL</text>
    <text x="35" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#fff">CAD</text>
  </g>

  <!-- Right: Signature -->
  <g transform="translate(660, 515)">
    <path d="M 10 28 Q 30 10, 50 25 T 90 20 T 130 25" fill="none" stroke="#04202c" stroke-width="2"/>
    <line x1="0" y1="36" x2="160" y2="36" stroke="#94a3b8" stroke-width="1"/>
    <text x="80" y="52" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#04202c">Amy Regan Morehouse</text>
    <text x="80" y="66" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#64748b">SVP, Global Training &amp; Enablement</text>
  </g>
</svg>
